name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/README.md'
      - 'README.md'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.0.app
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather

      - name: Build original iOS IPA
        run: make iphoneos

      - name: Upload Feather IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-original-baseline
          path: packages/Feather.ipa
          if-no-files-found: error
          retention-days: 7
